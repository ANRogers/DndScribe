<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Session Transcript</title>
	<link rel="stylesheet" href="/index.css" />
	<link rel="icon" type="image/x-icon" href="/assets/D20.png">
</head>
<body>

	<div class="page">
		<div class="top">
			<h1>Session Transcript</h1>
			<div class="status">
				<span class="status-dot" id="statusDot"></span>
				<span id="statusText">Connecting…</span>
			</div>
		</div>

		<div class="log" id="log">
			<div class="empty-state" id="emptyState">Nothing transcribed yet. Start talking in voice chat.</div>
		</div>
	</div>

	<script src="/socket.io/socket.io.js"></script>
	<script>
		const log = document.getElementById('log');
		const emptyState = document.getElementById('emptyState');
		const statusDot = document.getElementById('statusDot');
		const statusText = document.getElementById('statusText');

		

		function appendLine(entry) {
			if (emptyState) emptyState.remove();

			// Check BEFORE adding the new line, whether the user is already near the bottom.
			// A small threshold (e.g. 40px) accounts for the new line's own height,
			// so it still counts as "at the bottom" right before it's added.
			const wasNearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;

			const time = new Date(entry.timestamp).toLocaleTimeString([], {
				hour: '2-digit',
				minute: '2-digit',
				second: '2-digit',
			});

			const div = document.createElement('div');
			div.className = 'line';
			div.innerHTML = `
				<span class="time">${time}</span>
				<span class="speaker" style="color:${entry.colour}">${entry.speaker}</span>
				<span class="text">${entry.text}</span>
			`;

			log.appendChild(div);

			// Only auto-scroll if they were already at (or near) the bottom.
			if (wasNearBottom) {
				log.scrollTop = log.scrollHeight;
			}
		}

		// Load existing history once, when the page first opens
		fetch('/api/transcript')
			.then((res) => res.json())
			.then((entries) => entries.forEach(appendLine))
			.catch(() => {
				statusText.textContent = 'Could not load history';
			});

		// Then listen for new lines pushed live from the server
		const socket = io();

		socket.on('connect', () => {
			statusDot.classList.add('live');
			statusText.textContent = 'Live';
		});

		socket.on('disconnect', () => {
			statusDot.classList.remove('live');
			statusText.textContent = 'Disconnected';
		});

		socket.on('newEntry', appendLine);
	</script>
</body>
</html>
