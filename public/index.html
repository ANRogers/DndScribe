
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Session Transcript</title>
    <link rel="stylesheet" href="/index.css" />
    <link rel="icon" type="image/x-icon" href="/assets/D20.png">
</head>
<body>
    <div class="page">
        <div class="top">
            <h1>Session Transcript</h1>

            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </div>

        <select id="serverSelect">
            <option value="">Select a server...</option>
        </select>

        <div class="log" id="log">
            <div class="empty-state" id="emptyState">
                Select a server to view its transcript.
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const log = document.getElementById('log');
        const serverSelect = document.getElementById('serverSelect');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let selectedGuildId = null;

        // Display an empty state in the transcript log
        function showEmptyState(message) {
            log.innerHTML = '';

            const emptyState = document.createElement('div');
            emptyState.className = 'empty-state';
            emptyState.textContent = message;

            log.appendChild(emptyState);
        }

        // Append a transcript entry to the log
        function appendLine(entry) {
            const emptyState = log.querySelector('.empty-state');

            if (emptyState) {
                emptyState.remove();
            }

            const wasNearBottom =
                log.scrollHeight - log.scrollTop - log.clientHeight < 40;

            const time = new Date(entry.timestamp).toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
            });

            const div = document.createElement('div');
            div.className = 'line';

            const timeSpan = document.createElement('span');
            timeSpan.className = 'time';
            timeSpan.textContent = time;

            const speakerSpan = document.createElement('span');
            speakerSpan.className = 'speaker';
            speakerSpan.style.color = entry.colour;
            speakerSpan.textContent = entry.speaker;

            const textSpan = document.createElement('span');
            textSpan.className = 'text';
            textSpan.textContent = entry.text;

            div.appendChild(timeSpan);
            div.appendChild(speakerSpan);
            div.appendChild(textSpan);

            log.appendChild(div);

            if (wasNearBottom) {
                log.scrollTop = log.scrollHeight;
            }
        }

        // Load transcript history for the selected server
        function loadTranscript(guildId) {
            if (!guildId) {
                showEmptyState('Select a server to view its transcript.');
                return;
            }

            showEmptyState('Loading transcript...');

            fetch(`/api/transcript/${guildId}`)
                .then(res => {
                    if (!res.ok) {
                        throw new Error('Failed to load transcript');
                    }

                    return res.json();
                })
                .then(entries => {
                    if (selectedGuildId !== guildId) return;

                    if (entries.length === 0) {
                        showEmptyState('Nothing transcribed yet. Start talking in voice chat.');
                        return;
                    }

                    log.innerHTML = '';
                    entries.forEach(appendLine);
                })
                .catch(error => {
                    console.error(error);

                    if (selectedGuildId === guildId) {
                        showEmptyState('Could not load transcript history.');
                    }
                });
        }

        // Load the available servers from the bot
        function loadServers() {
            fetch('/api/guilds')
                .then(res => {
                    if (!res.ok) {
                        throw new Error('Failed to load servers');
                    }

                    return res.json();
                })
                .then(guilds => {
                    guilds.forEach(guild => {
                        const option = document.createElement('option');

                        option.value = guild.id;
                        option.textContent = guild.name;

                        serverSelect.appendChild(option);
                    });

                    if (guilds.length === 0) {
                        showEmptyState('No active transcription sessions found.');
                    }
                })
                .catch(error => {
                    console.error(error);
                    showEmptyState('Could not load available servers.');
                });
        }

        // Handle server selection
        serverSelect.addEventListener('change', () => {
            selectedGuildId = serverSelect.value;
            loadTranscript(selectedGuildId);
        });

        // Connect to Socket.IO
        const socket = io();

        socket.on('connect', () => {
            statusDot.classList.add('live');
            statusText.textContent = 'Live';
        });

        socket.on('disconnect', () => {
            statusDot.classList.remove('live');
            statusText.textContent = 'Disconnected';
        });

        // Listen for new transcript entries
        socket.on('newEntry', ({ guildId, entry }) => {
            if (guildId !== selectedGuildId) return;

            appendLine(entry);
        });

        // Initialise the page
        loadServers();
    </script>
</body>
</html>
